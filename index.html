<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,'Times New Roman',serif;background:#1a1a2e;background-image:radial-gradient(circle at 20% 50%,#16213e 0%,#0f0f1a 100%);background-attachment:fixed;color:#e8e8e8;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));line-height:1.55}
.game-container{max-width:860px;width:100%;background:#1e1e30;border:1px solid #3a3a5c;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7);padding:24px 28px;position:relative;overflow:hidden;margin-top:8px}
.game-container::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#c9a84c,#f0d878,#c9a84c)}
h1{font-size:1.5em;text-align:center;color:#f0d878;letter-spacing:1.5px;margin-bottom:4px;text-shadow:0 0 20px rgba(240,216,120,.3)}
.subtitle{text-align:center;color:#8a8aad;font-size:.82em;font-style:italic;margin-bottom:14px;border-bottom:1px solid #2a2a44;padding-bottom:12px}
.save-indicator{position:absolute;top:14px;right:18px;font-size:.7em;color:#2ecc71;opacity:0;transition:opacity .4s;pointer-events:none;font-family:'Courier New',monospace}
.save-indicator.show{opacity:1}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;margin-bottom:14px;padding:10px 12px;background:#14142a;border-radius:10px;border:1px solid #2a2a44;font-size:.8em}
.stat-item{display:flex;flex-direction:column;align-items:center}
.stat-label{color:#7a7aa0;font-size:.72em;text-transform:uppercase;letter-spacing:.5px;text-align:center}
.stat-value{font-weight:bold;font-size:1.1em;color:#f0d878}
.stat-bar{width:100%;height:3px;background:#2a2a44;border-radius:2px;margin-top:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.story-box{background:#14142a;border-left:3px solid #c9a84c;border-radius:0 10px 10px 0;padding:16px 18px;margin-bottom:16px;min-height:90px;font-size:.97em;color:#d0d0e0;animation:fadeIn .5s ease}
.story-box .narrator{color:#8a8aad;font-style:italic;font-size:.9em}
.story-box .dialogue{color:#a8d8ea;font-style:italic;margin:6px 0}
.story-box .success{color:#2ecc71;font-weight:bold}
.story-box .failure{color:#e74c3c;font-weight:bold}
.story-box .warning{color:#f39c12;font-weight:bold}
.story-box .highlight{color:#f0d878;font-weight:bold}
.story-box .law{color:#d8a8ea;font-size:.9em;background:#2a1a3a;padding:6px 10px;border-radius:6px;display:block;margin:6px 0;border-left:2px solid #d8a8ea}
.story-box .case-tag{display:inline-block;background:#2a2a48;color:#c9a84c;font-size:.78em;padding:2px 10px;border-radius:4px;margin-bottom:8px}
.story-box .stage{display:inline-block;background:#2a1a3a;color:#d8a8ea;font-size:.78em;padding:2px 10px;border-radius:4px;margin-bottom:8px;margin-left:6px}
.story-box .trap{display:inline-block;background:#4a1a1a;color:#e74c3c;font-size:.78em;padding:2px 10px;border-radius:4px;margin:4px 0;border:1px solid #e74c3c}
.story-box .inst{display:inline-block;background:#1a2a4a;color:#a8d8ea;font-size:.78em;padding:2px 10px;border-radius:4px;margin:4px 0;border:1px solid #a8d8ea}
.story-box .score-line{display:block;margin-top:8px;padding:6px 10px;background:#1a2a1a;border-radius:6px;font-size:.85em;color:#a8eaa8}
.story-box .score-line.bad{background:#2a1a1a;color:#eaa8a8}
.choices{display:flex;flex-direction:column;gap:8px;animation:fadeIn .6s ease}
.choice-btn{background:#22223a;border:1px solid #3a3a5c;border-radius:10px;padding:12px 16px;color:#d0d0e0;font-family:Georgia,serif;font-size:.93em;text-align:left;cursor:pointer;transition:all .25s;position:relative;touch-action:manipulation}
.choice-btn:hover{background:#2a2a48;border-color:#c9a84c;color:#f0d878;transform:translateX(3px)}
.choice-btn:active{transform:scale(.98)}
.choice-btn.pressed{opacity:.45;border-color:#2ecc71;background:#1a2a1a;transform:none!important;pointer-events:none;cursor:default}
.choice-btn.pressed::after{content:'✔';position:absolute;right:14px;color:#2ecc71;font-weight:bold}
.choice-btn.optional{border-color:#a8d8ea;background:#1a2a3a}
.choice-btn.optional:hover{border-color:#d8a8ea;background:#2a1a3a}
.choice-btn.finish-btn{background:#2a2a48;border-color:#c9a84c;color:#f0d878;font-weight:bold;margin-top:4px}
.choice-btn.finish-btn:hover{background:#3a3a5c}
.choice-btn .choice-tag{display:inline-block;background:#2a2a48;color:#8a8aad;font-size:.72em;padding:1px 7px;border-radius:4px;margin-right:7px;font-family:'Courier New',monospace}
.choice-btn.pressed .choice-tag{background:#1a3a1a;color:#2ecc71}
.choice-btn.optional .choice-tag{background:#1a2a4a;color:#a8d8ea}
.choice-btn.finish-btn .choice-tag{background:#3a3a1a;color:#f0d878}
.action-btn{background:linear-gradient(135deg,#c9a84c,#a88a3a);border:none;border-radius:8px;padding:11px 24px;color:#1a1a2e;font-family:Georgia,serif;font-size:.95em;font-weight:bold;cursor:pointer;transition:all .25s;margin:4px;touch-action:manipulation}
.action-btn:hover{background:linear-gradient(135deg,#f0d878,#c9a84c);transform:translateY(-2px)}
.action-btn:active{transform:scale(.97)}
.footer{text-align:center;margin-top:16px;padding-top:10px;border-top:1px solid #2a2a44;color:#5a5a7a;font-size:.75em;font-style:italic}
.footer-controls{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.footer-controls button{background:#22223a;border:1px solid #3a3a5c;color:#8a8aad;padding:5px 12px;border-radius:6px;font-size:.78em;cursor:pointer;font-family:Georgia,serif;transition:all .2s;touch-action:manipulation}
.footer-controls button:hover{border-color:#c9a84c;color:#f0d878}
.footer-controls button.danger:hover{border-color:#e74c3c;color:#e74c3c}
.install-banner{display:none;background:linear-gradient(135deg,#2a2a48,#1e1e30);border:1px solid #c9a84c;border-radius:10px;padding:10px 14px;margin-bottom:12px;align-items:center;justify-content:space-between;gap:10px;font-size:.85em}
.install-banner.show{display:flex}
.install-banner button{background:linear-gradient(135deg,#c9a84c,#a88a3a);border:none;border-radius:6px;padding:7px 16px;color:#1a1a2e;font-weight:bold;cursor:pointer;font-family:Georgia,serif;font-size:.88em}
.offline-banner{display:none;background:#e74c3c;color:#fff;text-align:center;padding:5px;font-size:.78em;border-radius:6px;margin-bottom:10px}
.offline-banner.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){body{padding:8px}.game-container{padding:16px 12px}h1{font-size:1.15em}.stats-bar{grid-template-columns:repeat(3,1fr);font-size:.7em}.choice-btn{padding:10px 12px;font-size:.86em}.save-indicator{top:8px;right:10px;font-size:.6em}}
</style>
</head>
<body>
<div class="game-container" id="game">
<div class="save-indicator" id="saveIndicator">💾 Сохранено</div>
<h1>⚖️ ЖУК: АДВОКАТ ИЗ СОЧИ</h1>
<div class="subtitle">Александр Николаевич Жук, 41 год · ЧГА · Сочи · 200 исков · v6</div>
<div class="offline-banner" id="offlineBanner">📴 Офлайн-режим</div>
<div class="install-banner" id="installBanner"><span>📲 Установить как приложение?</span><button id="installBtn">Установить</button></div>
<div class="stats-bar" id="statsBar"></div>
<div class="story-box" id="storyBox"></div>
<div class="choices" id="choices"></div>

<div id="footerText">Гражданский и арбитражный процесс · Краснодарский край</div>
<div class="footer-controls">
<button onclick="manualSave()">💾 Сохранить</button>
<button onclick="manualLoad()">📂 Загрузить</button>

</div>
</div>
</div>
<script>
// ============ PWA ============
const manifestData={name:'Жук: Адвокат из Сочи',short_name:'Жук',description:'Текстовая RPG юриста',start_url:'.',scope:'.',display:'standalone',orientation:'portrait',background_color:'#1a1a2e',theme_color:'#c9a84c',lang:'ru',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%231a1a2e'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E",sizes:'192x192',type:'image/svg+xml',purpose:'any maskable'},{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='64' fill='%231a1a2e'/%3E%3Ctext x='256' y='350' font-size='280' text-anchor='middle'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
try{const mb=new Blob([JSON.stringify(manifestData)],{type:'application/manifest+json'});document.getElementById('manifestLink').href=URL.createObjectURL(mb)}catch(e){}
const swCode=`const C='zhuk-v6';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./index.html']).catch(()=>{})).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{if(r&&r.status===200){const cl=r.clone();caches.open(C).then(ca=>ca.put(e.request,cl))}return r}).catch(()=>c)))})};`;
if('serviceWorker'in navigator){try{const sb=new Blob([swCode],{type:'application/javascript'});navigator.serviceWorker.register(URL.createObjectURL(sb),{scope:'./'}).catch(e=>console.warn('SW:',e))}catch(e){}}
let deferredPrompt=null;const installBanner=document.getElementById('installBanner'),installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBanner.classList.add('show')});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt){installBanner.classList.remove('show');return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBanner.classList.remove('show')});
window.addEventListener('appinstalled',()=>installBanner.classList.remove('show'));
const offlineBanner=document.getElementById('offlineBanner');function updOnline(){offlineBanner.classList.toggle('show',!navigator.onLine)}window.addEventListener('online',updOnline);window.addEventListener('offline',updOnline);updOnline();

// ============ STATE ============
const state={money:30000,reputation:10,energy:100,knowledge:20,stress:0,day:0,chapter:1,case1:null,hasExpertise:false,bribeJudge:false,casesWon:0,casesLost:0,casePool:[],currentCase:null,courtState:null,gameOver:false};
const SAVE_KEY='zhuk_save_v6';
const DAILY_COST=1350;
const FEE_RATE=0.075;

const storyBox=document.getElementById('storyBox'),choicesDiv=document.getElementById('choices'),statsBar=document.getElementById('statsBar'),footer=document.getElementById('footerText'),saveIndicator=document.getElementById('saveIndicator');
let saveTimeout=null,isLoading=false;
function showSaveIndicator(t='💾 Сохранено'){saveIndicator.textContent=t;saveIndicator.classList.add('show');clearTimeout(saveTimeout);saveTimeout=setTimeout(()=>saveIndicator.classList.remove('show'),1200)}
function saveGame(){if(isLoading)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({...state,casePool:state.casePool.map(c=>({id:c.id,resolved:c.resolved})),savedAt:new Date().toISOString()}));showSaveIndicator()}catch(e){console.warn(e)}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const d=JSON.parse(raw);isLoading=true;Object.assign(state,{money:d.money??30000,reputation:d.reputation??10,energy:d.energy??100,knowledge:d.knowledge??20,stress:d.stress??0,day:d.day??0,chapter:d.chapter??1,case1:d.case1??null,hasExpertise:d.hasExpertise??false,bribeJudge:d.bribeJudge??false,casesWon:d.casesWon??0,casesLost:d.casesLost??0,gameOver:d.gameOver??false});const fresh=generateCases();state.casePool=fresh.map(c=>{const s=(d.casePool||[]).find(x=>x.id===c.id);return{...c,resolved:s?s.resolved:false}});isLoading=false;return true}catch(e){console.warn(e);isLoading=false;return false}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function manualSave(){saveGame();showSaveIndicator('💾 Вручную')}
function manualLoad(){if(loadGame()){renderStats();showSaveIndicator('📂 Загружено');if(state.chapter>=6&&!state.gameOver)showResumeMenu('📂 Загружено.');else if(state.gameOver)gameOver(state.stress>=100?'burnout':'bankrupt');else startChapter1()}else showSaveIndicator('❌ Нет сохранений')}
function resetGame(){if(!confirm('Удалить сохранение?'))return;clearSave();showSaveIndicator('🗑 Удалено');setTimeout(()=>location.reload(),600)}

function d20(){return Math.floor(Math.random()*20)+1}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function applyEffects(e){if(e.money)state.money+=e.money;if(e.reputation)state.reputation=clamp(state.reputation+e.reputation,0,100);if(e.energy)state.energy=clamp(state.energy+e.energy,0,100);if(e.knowledge)state.knowledge=clamp(state.knowledge+e.knowledge,0,100);if(e.stress)state.stress=clamp(state.stress+e.stress,0,100)}
function passDays(n){state.day+=n;state.money-=DAILY_COST*n}

function renderStats(){
const items=[
{label:'💰 Деньги',value:state.money.toLocaleString('ru-RU')+' ₽',raw:state.money,max:500000,inv:false},
{label:'⭐ Репутация',value:state.reputation+'/100',raw:state.reputation,max:100,inv:false},
{label:'⚡ Энергия',value:state.energy+'/100',raw:state.energy,max:100,inv:false},
{label:'📚 Знания',value:state.knowledge+'/100',raw:state.knowledge,max:100,inv:false},
{label:'😰 Стресс',value:state.stress+'/100',raw:state.stress,max:100,inv:true},
{label:'📅 День',value:state.day,raw:0,max:1,inv:false,noBar:true},
{label:'🏆 Победы',value:state.casesWon+'/'+state.casesLost,raw:0,max:1,inv:false,noBar:true}
];
statsBar.innerHTML=items.map(it=>{const p=Math.min(100,(it.raw/it.max)*100);const c=it.inv?(it.raw>60?'#e74c3c':it.raw>30?'#f39c12':'#2ecc71'):(it.raw>it.max*.6?'#2ecc71':it.raw>it.max*.3?'#f39c12':'#e74c3c');return `<div class="stat-item"><span class="stat-label">${it.label}</span><span class="stat-value">${it.value}</span>${!it.noBar?`<div class="stat-bar"><div class="stat-bar-fill" style="width:${p}%;background:${c}"></div></div>`:''}</div>`}).join('');
saveGame();
}
function setStory(h){storyBox.innerHTML=h;storyBox.style.animation='none';void storyBox.offsetWidth;storyBox.style.animation='fadeIn .5s ease'}
function setChoices(ch){choicesDiv.innerHTML='';ch.forEach(c=>{const b=document.createElement('button');b.className='choice-btn'+(c.optional?' optional':'')+(c.finish?' finish-btn':'');b.innerHTML=`<span class="choice-tag">${c.tag}</span>${c.text}`;b.onclick=()=>c.action();choicesDiv.appendChild(b)});choicesDiv.style.animation='none';void choicesDiv.offsetWidth;choicesDiv.style.animation='fadeIn .6s ease'}
function addRestartButton(){const b=document.createElement('button');b.className='action-btn';b.textContent='🔄 Начать заново';b.onclick=()=>{clearSave();location.reload()};choicesDiv.appendChild(b)}

// ============ 200 CASES ============
function generateCases(){
const civil=[
{n:'Взыскание долга по расписке',d:'Должник не возвращает 150 000 ₽ по нотариальной расписке.',s:10,a:150000,trap:'srok'},
{n:'Залив квартиры',d:'Сосед сверху залил квартиру, отказывается платить.',s:12,a:80000,trap:'otvetchik'},
{n:'Расторжение брака и раздел имущества',d:'Супруги делят квартиру и автомобиль после развода.',s:14,a:200000,trap:'none'},

{n:'Выселение из жилого помещения',d:'Наниматель не платит за квартиру и отказывается выезжать.',s:11,a:90000,trap:'pretenziya'},
{n:'Оспаривание завещания',d:'Родственники оспаривают завещание умершего.',s:16,a:250000,trap:'srok'},
{n:'Взыскание компенсации морального вреда',d:'Клиент требует компенсацию за публичное оскорбление.',s:10,a:70000,trap:'none'},

{n:'Взыскание неустойки по ДДУ',d:'Застройщик просрочил сдачу дома, дольщик требует неустойку.',s:14,a:200000,trap:'pretenziya'},
{n:'Оспаривание кадастровой стоимости',d:'Собственник требует снизить кадастровую стоимость недвижимости.',s:13,a:110000,trap:'podvedomstvennost'},

{n:'Признание сделки недействительной',d:'Истец требует признать договор купли-продажи мнимым.',s:16,a:220000,trap:'srok'},
{n:'Взыскание задолженности по ЖКХ',d:'УК требует взыскать долг за коммунальные услуги.',s:7,a:30000,trap:'pretenziya'},
{n:'Защита чести и достоинства',d:'Клиент требует опровержения порочащих сведений в СМИ.',s:14,a:130000,trap:'none'},
{n:'Взыскание страхового возмещения',d:'Страховая компания занизила выплату по ОСАГО.',s:12,a:85000,trap:'pretenziya'},

{n:'Взыскание арендной платы',d:'Арендодатель требует взыскать долг с арендатора.',s:8,a:60000,trap:'pretenziya'},

// ============ CASE FLOW ============
function pickRandomCase(){const av=state.casePool.filter(c=>!c.resolved);if(!av.length){state.casePool=generateCases();return pickRandomCase()}return av[Math.floor(Math.random()*av.length)]}

function showResumeMenu(reason){renderStats();setStory(`<div class="narrator">${reason}</div><br><div class="narrator">📅 День ${state.day} · 🏆 ${state.casesWon} побед · ✖ ${state.casesLost} · 💰 ${state.money.toLocaleString('ru-RU')} ₽</div><br><div class="narrator">Что делаем?</div>`);
setChoices([
{tag:'→',text:'Продолжить дела (взять следующий иск)',action:startNewCase},
{tag:'🛋',text:'Отдохнуть 7 дней (энергия +40, стресс −30, расходы за неделю)',action:()=>{passDays(7);applyEffects({energy:40,stress:-30});renderStats();setStory(`<div class="narrator">Неделя отдыха. Энергия +40, стресс −30. Расходы: −${(DAILY_COST*7).toLocaleString('ru-RU')} ₽.</div>`);setTimeout(()=>showResumeMenu('Вы отдохнули.'),1500)}},
{tag:'🔄',text:'Начать заново',action:()=>{if(confirm('Стереть сохранение?')){clearSave();location.reload()}}}
])}

state.currentCase=pickRandomCase();
const c=state.currentCase;state.chapter=6;
renderStats();
const fee=Math.round(c.amount*FEE_RATE);
setStory(`
<div class="case-tag">${c.type} · Дело №${c.id} · Сложность ${c.difficulty}/20</div>
<div class="highlight">${c.name}</div>
<br>
<div class="narrator">${c.description}</div>
<br>
<div class="narrator">Сумма иска: <span class="highlight">${c.amount.toLocaleString('ru-RU')} ₽</span>. Гонорар (7,5%): <span class="highlight">${fee.toLocaleString('ru-RU')} ₽</span>.</div>
<br>
<div class="narrator"><b>7 вариантов подготовки.</b> Выберите, как изучать дело:</div>
`);
setChoices([
{tag:'1',text:'Ничего не делать — сразу в суд (быстро, но без бонусов, +5 стресса)',action:()=>{passDays(3);applyEffects({stress:5});startCourtPrep(c,0,0,'no-prep')}},
{tag:'2',text:'Прочитать документы клиента (2 дня, +2 знания, бонус +2)',action:()=>{passDays(2);applyEffects({knowledge:2,energy:-5});startCourtPrep(c,2,0,'read')}},
{tag:'3',text:'Изучить судебную практику (5 дней, +5 знаний, бонус +4)',action:()=>{passDays(5);applyEffects({knowledge:5,energy:-10});startCourtPrep(c,4,0,'practice')}},
{tag:'4',text:'Проверить подсудность и сроки (3 дня, +3 знания, бонус +4)',action:()=>{passDays(3);applyEffects({knowledge:3,energy:-5});startCourtPrep(c,4,0,'jurisdiction')}},
{tag:'5',text:'Собрать доказательства и свидетелей (7 дней, бонус +6, −10 000 ₽)',action:()=>{passDays(7);applyEffects({knowledge:4,energy:-15,money:-10000,stress:5});startCourtPrep(c,6,0,'evidence')}},
{tag:'6',text:'Заказать экспертизу (−25 000 ₽, 10 дней, бонус +8)',action:()=>{passDays(10);applyEffects({knowledge:5,energy:-10,money:-25000,stress:10});startCourtPrep(c,8,0,'expertise')}},
{tag:'7',text:'Полная подготовка: практика + экспертиза + свидетели (15 дней, −35 000 ₽, бонус +10, стресс +15)',action:()=>{passDays(15);applyEffects({knowledge:8,energy:-20,money:-35000,stress:15});startCourtPrep(c,10,0,'full')}}
])}

// 8 процессуальных стадий
const STAGES=[
{name:'Претензионный порядок',key:'pretenziya'},
{name:'Составление иска',key:'isk'},
{name:'Предварительное заседание',key:'prelim'},
{name:'Ходатайства и экспертизы',key:'motions'},
{name:'Основное заседание',key:'main'},
{name:'Исследование доказательств',key:'evidence'},
{name:'Прения сторон',key:'debates'},
{name:'Решение суда',key:'verdict'}
];

function startCourtPrep(c,prepBonus,prepCost,prepType){
state.courtState={case:c,prepBonus,fee:Math.round(c.amount*FEE_RATE),score:prepBonus,stage:0,maxStages:8,log:[],prepType,trapsHit:0,interimMeasure:false,counterclaim:false,appeal:false,cassation:false};
showStage();
}

function showStage(){
const cs=state.courtState;const c=cs.case;const st=STAGES[cs.stage];
renderStats();

if(c.unwinnable&&cs.stage===0){
setStory(`
<div class="case-tag">${c.type} · Дело №${c.id}</div>
<div class="stage">Стадия 0/8: Анализ перспектив</div>
<br>
<div class="trap">⚠ ЮРИДИЧЕСКАЯ ЛОВУШКА</div>
<br>
<div class="narrator">Вы изучаете дело и понимаете: <b>оно невыигрышное</b>. ${c.trap==='srok'?'Срок исковой давности истёк и не подлежит восстановлению.':c.trap==='podvedomstvennost'?'Дело неподсудно этому суду, а передача в надлежащий суд невозможна.':c.trap==='pretenziya'?'Претензионный порядок не соблюдён, а срок на его соблюдение упущен.':'Нет надлежащего ответчика, а замена невозможна.'}</div>
<br>
<div class="narrator">Что делать?</div>
`);
setChoices([
{tag:'А',text:'Отказаться от дела (репутация −1, но сэкономить деньги и нервы)',action:()=>{c.resolved=true;applyEffects({reputation:-1});renderStats();setStory(`<div class="narrator">Вы вежливо отказываетесь. Клиент уходит. −1 Репутации, но вы сохранили деньги.</div>`);setTimeout(()=>setChoices([{tag:'→',text:'Следующее дело',action:startNewCase}]),1500)}},
{tag:'Б',text:'Взяться всё равно (проигрыш гарантирован, но получите опыт)',action:()=>{cs.stage=1;showStage()}}
]);
return;
}

const pressed=cs.log.filter(l=>l.stage===cs.stage).map(l=>l.letter);
const anyPressed=pressed.length>0;

let stageHtml=`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="stage">Стадия ${cs.stage+1}/8: ${st.name}</div><div class="highlight">${c.name}</div><br>`;

if(cs.stage===0){
stageHtml+=`<div class="narrator">${c.description}</div><br><div class="narrator"><b>Можно нажать 1, 2 или 3 действия — необязательно все.</b> Каждое действие даёт баллы, но ошибка отнимает их. <b>Кнопка «Завершить стадию» появится сразу после первого действия.</b></div>`;
} else if(cs.stage===1){
stageHtml+=`<div class="narrator">Составляем исковое заявление. Нужно учесть госпошлину, подсудность, приложения.</div><br><div class="law">Ст. 131-132 ГПК РФ / ст. 125-126 АПК РФ — требования к иску</div>`;
} else if(cs.stage===2){
stageHtml+=`<div class="narrator">Предварительное заседание. Судья уточняет позиции, назначает экспертизы.</div><br><div class="inst">🆕 Обеспечительные меры — дополнительное действие (ст. 139-140 ГПК / ст. 90-91 АПК)</div>`;
} else if(cs.stage===3){
stageHtml+=`<div class="narrator">Ходатайства и заявления. Можно истребовать доказательства, назначить экспертизу, привлечь третьих лиц.</div>`;
} else if(cs.stage===4){
stageHtml+=`<div class="narrator">Основное заседание. Прения по существу спора.</div><br><div class="inst">🆕 Встречный иск — дополнительное действие (ст. 137-138 ГПК / ст. 132 АПК)</div>`;
} else if(cs.stage===5){
stageHtml+=`<div class="narrator">Исследование доказательств: допрос свидетелей, оглашение документов, заключение эксперта.</div>`;
} else if(cs.stage===6){
stageHtml+=`<div class="narrator">Прения сторон. Финальные речи.</div>`;
} else {
stageHtml+=`<div class="narrator">Суд удаляется в совещательную комнату. Ждём решения.</div>`;
}

stageHtml+=`<br><div class="score-line">Текущий счёт: <span class="highlight">${cs.score}</span> · Нужно для победы: <span class="highlight">${c.difficulty*3+10}</span> · Действий выполнено: ${pressed.length}/3</div>`;

setStory(stageHtml);

if(cs.stage===7){
setChoices([{tag:'⚖️',text:'Выслушать решение суда',action:()=>resolveVerdict(cs)}]);
return;
}

const choices=[
{tag:'А',letter:'A',text:stageTextA(cs.stage)},
{tag:'Б',letter:'B',text:stageTextB(cs.stage)},
{tag:'В',letter:'C',text:stageTextC(cs.stage)}
];
choicesDiv.innerHTML='';
choices.forEach(ch=>{
const b=document.createElement('button');
b.className='choice-btn'+(pressed.includes(ch.letter)?' pressed':'');
b.innerHTML=`<span class="choice-tag">${ch.tag}</span>${ch.text}`;
if(!pressed.includes(ch.letter))b.onclick=()=>stageAction(cs,STAGES[cs.stage].key,ch.letter);
choicesDiv.appendChild(b);
});

if(cs.stage===2&&!cs.interimMeasure){
const b=document.createElement('button');b.className='choice-btn optional';b.innerHTML=`<span class="choice-tag">🛡</span>ДОПОЛНИТЕЛЬНО: Обеспечительные меры (−15 000 ₽, 5 дней)`;b.onclick=()=>optionalInterim(cs);choicesDiv.appendChild(b);
}
if(cs.stage===4&&!cs.counterclaim){
const b=document.createElement('button');b.className='choice-btn optional';b.innerHTML=`<span class="choice-tag">⚔</span>ДОПОЛНИТЕЛЬНО: Встречный иск (−20 000 ₽, 10 дней)`;b.onclick=()=>optionalCounterclaim(cs);choicesDiv.appendChild(b);
}

// Кнопка «Завершить стадию» — только если нажато хотя бы одно действие
if(anyPressed){
const b=document.createElement('button');
b.className='choice-btn finish-btn';
b.innerHTML=`<span class="choice-tag">→</span>Завершить стадию ${cs.stage+1}/8 и перейти к следующей (${STAGES[cs.stage+1].name})`;
b.onclick=()=>{cs.stage++;showStage()};
choicesDiv.appendChild(b);
}
}

function stageTextA(st){const t=['Направить претензию (ст. 132 ГПК / ст. 4 АПК)','Рассчитать госпошлину (ст. 333.19 НК РФ)','Заявить ходатайство о назначении экспертизы','Истребовать доказательства (ст. 57 ГПК / ст. 66 АПК)','Изложить правовую позицию','Допросить свидетеля','Резюмировать ключевые доводы'];return t[st]||''}
function stageTextB(st){const t=['Проверить сроки и подсудность','Проверить подсудность (районный/мировой/арбитраж)','Уточнить исковые требования','Привлечь третье лицо','Ответить на доводы оппонента','Огласить письменные доказательства','Указать на процессуальные нарушения'];return t[st]||''}
function stageTextC(st){const t=['Собрать документы для претензии','Составить приложения к иску','Заявить о вызове свидетелей','Заявить о фальсификации доказательств (ст. 186 ГПК)','Заявить о пропуске срока оппонентом','Задать вопросы эксперту','Ответить на реплику оппонента'];return t[st]||''}

// ==== ОБЕСПЕЧИТЕЛЬНЫЕ МЕРЫ ====
function optionalInterim(cs){
const c=cs.case;
passDays(5);applyEffects({money:-15000,stress:5,energy:-5});renderStats();
const roll=d20();
const success=roll+Math.floor(state.knowledge/10)>=10;
if(success){cs.interimMeasure=true;cs.score+=8;setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">🛡 Обеспечительные меры</div><br><div class="success">✔ Суд удовлетворил ходатайство! Имущество ответчика арестовано. +8 баллов.</div><br><div class="narrator">Бросок: ${roll} · Счёт: <span class="highlight">${cs.score}</span></div>`)}
else{cs.score=Math.max(0,cs.score-4);setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">🛡 Обеспечительные меры</div><br><div class="failure">✖ Суд отказал. −4 балла, деньги и дни потрачены зря.</div><br><div class="narrator">Бросок: ${roll}</div>`)}
setTimeout(()=>showStage(),1500);
}

// ==== ВСТРЕЧНЫЙ ИСК ====
function optionalCounterclaim(cs){
const c=cs.case;
passDays(10);applyEffects({money:-20000,stress:15,energy:-10});renderStats();
const roll=d20();
const success=roll+Math.floor(state.knowledge/10)>=12;
if(success){cs.counterclaim=true;cs.score+=10;setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">⚔ Встречный иск</div><br><div class="success">✔ Суд принял встречный иск! +10 баллов, позиция усилена.</div><br><div class="narrator">Бросок: ${roll} · Счёт: <span class="highlight">${cs.score}</span></div>`)}
else{cs.score=Math.max(0,cs.score-6);setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">⚔ Встречный иск</div><br><div class="failure">✖ Суд вернул встречный иск (ст. 138 ГПК). −6 баллов, деньги потрачены.</div><br><div class="narrator">Бросок: ${roll} · Счёт: <span class="highlight">${cs.score}</span></div>`)}
setTimeout(()=>showStage(),1500);
}

// ==== ДЕЙСТВИЕ НА СТАДИИ ====
function stageAction(cs,stageKey,letter){
const c=cs.case;
const roll=d20();
const knowledgeBonus=Math.floor(state.knowledge/10);
const bribeBonus=state.bribeJudge?3:0;
const stressPenalty=state.stress>60?-3:0;
let score=0,text='',result='success';

if(stageKey==='pretenziya'){
if(letter==='A'){score=4+Math.floor(roll/4)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Претензия направлена надлежащим образом, срок соблюдён.':'Претензия направлена с нарушениями (не тот адрес/форма).'}
else if(letter==='B'){score=3+Math.floor(roll/5)+knowledgeBonus;result=(roll+knowledgeBonus)>=10?'success':'failure';text=(roll+knowledgeBonus)>=10?'Сроки и подсудность проверены — всё в порядке.':'Вы пропустили срок / ошиблись с подсудностью.'}
else{score=3+Math.floor(roll/5)+knowledgeBonus;result=roll>=7?'success':'failure';text=roll>=7?'Документы собраны, приложения готовы.':'Не хватает документов для претензии.'}
} else if(stageKey==='isk'){
if(letter==='A'){score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Госпошлина рассчитана верно (ст. 333.19 НК).':'Госпошлина рассчитана с ошибкой — иск могут оставить без движения.'}
else if(letter==='B'){score=3+Math.floor(roll/5)+knowledgeBonus;result=roll>=7?'success':'failure';text=roll>=7?'Подсудность определена верно.':'Подсудность определена неверно — иск вернут.'}
else{score=3+Math.floor(roll/6)+knowledgeBonus;result=roll>=6?'success':'failure';text=roll>=6?'Приложения соответствуют ст. 132 ГПК.':'Приложения неполные.'}
} else if(stageKey==='prelim'){
if(letter==='A'){score=5+Math.floor(roll/5)+knowledgeBonus;result=roll>=9?'success':'failure';text=roll>=9?'Экспертиза назначена — это усилит позицию.':'Суд отказал в экспертизе.'}
else if(letter==='B'){score=3+Math.floor(roll/5)+knowledgeBonus;result=roll>=7?'success':'failure';text=roll>=7?'Требования уточнены.':'Уточнения отклонены.'}
else{score=3+Math.floor(roll/6)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Свидетели вызваны.':'Суд отказал в вызове свидетелей.'}
} else if(stageKey==='motions'){
if(letter==='A'){score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Доказательства истребованы.':'Суд отказал в истребовании.'}
else if(letter==='B'){score=3+Math.floor(roll/6)+knowledgeBonus;result=roll>=9?'success':'failure';text=roll>=9?'Третье лицо привлечено.':'Суд отказал в привлечении.'}
else{score=(roll>=15?8:-4)+Math.floor(roll/5);result=roll>=15?'success':'failure';text=roll>=15?'Заявление о фальсификации удовлетворено — оппонент в шоке.':'Суд отклонил заявление — риск негативных последствий.'}
} else if(stageKey==='main'){
if(letter==='A'){score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Позиция изложена чётко.':'Позиция сбивчива.'}
else if(letter==='B'){score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=9?'success':'failure';text=roll>=9?'Вы парировали доводы оппонента.':'Оппонент переиграл вас.'}
else{score=(c.trap==='srok'?9:2)+Math.floor(roll/4);result=c.trap==='srok'&&roll>=8?'success':'failure';text=c.trap==='srok'&&roll>=8?'Вы заявили о пропуске срока — суд может отказать оппоненту!':'Заявление о сроке не сработало.'}
} else if(stageKey==='evidence'){
if(letter==='A'){score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Свидетель путается — вы поймали противоречия.':'Свидетель даёт чёткие показания против вас.'}
else if(letter==='B'){score=3+Math.floor(roll/6)+knowledgeBonus;result=roll>=7?'success':'failure';text=roll>=7?'Документы оглашены, суд принял.':'Документы признаны недопустимыми.'}
else{score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=9?'success':'failure';text=roll>=9?'Эксперт подтвердил вашу позицию.':'Эксперт дал неоднозначный ответ.'}
} else if(stageKey==='debates'){
if(letter==='A'){score=4+Math.floor(roll/5)+knowledgeBonus;result=roll>=7?'success':'failure';text=roll>=7?'Резюме убедительное.':'Резюме скомканное.'}
else if(letter==='B'){score=3+Math.floor(roll/5)+knowledgeBonus;result=roll>=9?'success':'failure';text=roll>=9?'Нарушения указаны — суд зафиксировал.':'Суд не нашёл нарушений.'}
else{score=3+Math.floor(roll/6)+knowledgeBonus;result=roll>=8?'success':'failure';text=roll>=8?'Реплика сработала.':'Реплика не удалась.'}
}

score+=bribeBonus+stressPenalty;
// Штраф за ошибку: при провале — минус баллы
if(result==='failure'){score=-Math.max(2,Math.floor(score/2))}
cs.score=Math.max(0,cs.score+score);
cs.log.push({stage:cs.stage,stageKey,letter,roll,score:score,result});

const stName=STAGES[cs.stage].name;
setStory(`
<div class="case-tag">${c.type} · Дело №${c.id}</div>
<div class="stage">Стадия ${cs.stage+1}/8: ${stName}</div>
<br>
<div class="${result==='success'?'success':'failure'}">${result==='success'?'✔':'✖'} ${text}</div>
<br>
<div class="score-line${result==='success'?'':' bad'}">Бросок: ${roll} · Знания: +${knowledgeBonus} · ${result==='success'?'Начислено':'Списано'}: <span class="highlight">${result==='success'?'+':''}${score}</span> · Общий счёт: <span class="highlight">${cs.score}</span></div>
`);
applyEffects({stress:2,energy:-2});
renderStats();
setTimeout(()=>showStage(),1200);
}

function resolveVerdict(cs){
const c=cs.case;
const threshold=c.difficulty*3+10;
const won=!c.unwinnable&&cs.score>=threshold;
c.resolved=true;

if(won){state.casesWon++;applyEffects({money:cs.fee,reputation:5+Math.floor(c.difficulty/4),stress:-5,knowledge:2});renderStats();
setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="success" style="font-size:1.15em;">🏆 РЕШЕНИЕ В ВАШУ ПОЛЬЗУ!</div><br><div class="narrator">Судья оглашает решение: иск удовлетворён. Счёт <span class="highlight">${cs.score}</span> ≥ ${threshold}.</div><br><div class="narrator">Гонорар: <span class="highlight">${cs.fee.toLocaleString('ru-RU')} ₽</span>. Репутация +${5+Math.floor(c.difficulty/4)}.</div>${cs.interimMeasure?'<br><div class="inst">🛡 Обеспечительные меры помогли взыскать больше!</div>':''}${cs.counterclaim?'<br><div class="inst">⚔ Встречный иск усилил позицию!</div>':''}`);
setTimeout(()=>{setChoices([
{tag:'→',text:'Следующее дело',action:startNewCase},
{tag:'🛋',text:'Отдохнуть 7 дней (энергия +40, стресс −30)',action:()=>{passDays(7);applyEffects({energy:40,stress:-30});renderStats();setStory(`<div class="narrator">Неделя отдыха. Расходы: −${(DAILY_COST*7).toLocaleString('ru-RU')} ₽.</div>`);setTimeout(()=>setChoices([{tag:'→',text:'Вернуться к делам',action:startNewCase}]),1500)}}
])},2400)}
else{
state.casesLost++;
applyEffects({reputation:-3,stress:10,knowledge:3});
renderStats();
setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="failure" style="font-size:1.15em;">✖ В ИСКЕ ОТКАЗАНО</div><br><div class="narrator">Счёт <span class="highlight">${cs.score}</span> < ${threshold}${c.unwinnable?' (дело было невыигрышным)':''}. −3 Репутации, +10 Стресса, +3 Знаний.</div><br><div class="inst">🆕 Апелляция (гл. 39 ГПК / гл. 34 АПК)</div><br><div class="narrator">Можно обжаловать решение. Стоит денег и дней, но даёт шанс.</div>`);
setTimeout(()=>setChoices([
{tag:'📤',text:'Подать апелляцию (−20 000 ₽, 30 дней, шанс ~40%)',action:()=>appealCase(cs)},
{tag:'❌',text:'Смириться и идти дальше',action:()=>{if(state.money<-50000){gameOver('bankrupt');return}if(state.stress>=100){gameOver('burnout');return}startNewCase()}}
]),2400)}
}

function appealCase(cs){
const c=cs.case;
passDays(30);applyEffects({money:-20000,stress:15,energy:-15});renderStats();
const roll=d20();
const appealSuccess=roll+Math.floor(state.knowledge/10)+(cs.score>=c.difficulty*2?5:0)>=13;
if(appealSuccess){
state.casesLost--;state.casesWon++;
const fee=Math.round(cs.fee*0.7);
applyEffects({money:fee,reputation:3,stress:-5});renderStats();
setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">📤 Апелляция</div><br><div class="success">✔ Апелляционный суд отменил решение первой инстанции! Дело пересмотрено в вашу пользу.</div><br><div class="narrator">Бросок: ${roll}. Гонорар (70%): ${fee.toLocaleString('ru-RU')} ₽. Репутация +3.</div>`);
setTimeout(()=>{setChoices([{tag:'→',text:'Следующее дело',action:startNewCase}])},2400);
} else {
applyEffects({stress:15,reputation:-2});renderStats();
setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">📤 Апелляция</div><br><div class="failure">✖ Апелляционный суд оставил решение без изменения. Деньги и 30 дней потрачены зря.</div><br><div class="inst">🆕 Кассация (гл. 41 ГПК / гл. 35 АПК)</div><br><div class="narrator">Можно подать кассационную жалобу. Очень дорого, но иногда единственный путь.</div>`);
setTimeout(()=>setChoices([
{tag:'📤',text:'Подать кассацию (−40 000 ₽, 60 дней, шанс ~20%)',action:()=>cassationCase(cs)},
{tag:'❌',text:'Смириться и идти дальше',action:()=>{if(state.money<-50000){gameOver('bankrupt');return}if(state.stress>=100){gameOver('burnout');return}startNewCase()}}
]),2400)}
}

function cassationCase(cs){
const c=cs.case;
passDays(60);applyEffects({money:-40000,stress:20,energy:-20});renderStats();
const roll=d20();
const cassSuccess=roll+Math.floor(state.knowledge/12)>=17;
if(cassSuccess){
state.casesLost--;state.casesWon++;
const fee=Math.round(cs.fee*0.5);
applyEffects({money:fee,reputation:5,stress:-10});renderStats();
setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">📤 Кассация</div><br><div class="success">✔ Кассационный суд отменил решение! Это редкая удача. Гонорар (50%): ${fee.toLocaleString('ru-RU')} ₽.</div>`);
setTimeout(()=>{setChoices([{tag:'→',text:'Следующее дело',action:startNewCase}])},2400);
} else {
applyEffects({stress:20,reputation:-1});renderStats();
setStory(`<div class="case-tag">${c.type} · Дело №${c.id}</div><div class="inst">📤 Кассация</div><br><div class="failure">✖ Кассация отказала в передаче жалобы. Дело окончательно проиграно. Деньги и 60 дней потрачены.</div>`);
setTimeout(()=>{if(state.money<-50000){gameOver('bankrupt');return}if(state.stress>=100){gameOver('burnout');return}startNewCase()},2400)}
}

function gameOver(reason){state.gameOver=true;state.chapter=7;renderStats();const title=reason==='bankrupt'?'📉 БАНКРОТСТВО':'🔥 ВЫГОРАНИЕ';const text=reason==='bankrupt'?'Долги превысили 50 000 ₽. Офис закрыт. Но опыт остался.':'Стресс достиг 100. Вы больше не можете работать.';setStory(`<div style="text-align:center;font-size:1.4em;color:#e74c3c;margin-bottom:15px;">${title}</div><div class="narrator">${text}</div><br><div style="text-align:center;font-size:.9em;color:#8a8aad;">📅 День ${state.day} · 🏆 ${state.casesWon} побед · ✖ ${state.casesLost} · 💰 ${state.money.toLocaleString('ru-RU')} ₽</div>`);setChoices([]);addRestartButton();footer.textContent='Игра окончена'}

// ============ INTRO ============
function startChapter1(){state.chapter=1;renderStats();setStory(`<div class="narrator">Понедельник, 9:00. Офис на Курортном проспекте. Пахнет кофе и старой мебелью.</div><br><div class="narrator">Звонок. Галина Петровна, 72 года: УК содрала 28 тысяч за ремонт, которого не было.</div><br><div class="narrator">Что ответить?</div>`);setChoices([
{tag:'А',text:'Взять оба дела и запросить 15 000 ₽.',action:()=>{state.case1='both';applyEffects({money:15000,reputation:5,energy:-10});renderStats();setStory(`<div class="success">✔ Вы берёте оба дела.</div>`);setTimeout(startChapter2,1200)}},
{tag:'Б',text:'Взять только дело против УК за 10 000 ₽.',action:()=>{state.case1='uk';applyEffects({money:10000,reputation:2,energy:-5});renderStats();setStory(`<div class="narrator">Вы сосредоточитесь на деле против УК.</div>`);setTimeout(startChapter2,1200)}},
{tag:'В',text:'Отказаться — вы по арбитражу.',action:()=>{state.case1='declined';applyEffects({reputation:-3});renderStats();setStory(`<div class="failure">✖ Галина Петровна расстроена.</div>`);setTimeout(()=>startChapter2(true),2000)}}
])}

function startChapter2(forced=false){state.chapter=2;renderStats();if(state.case1==='declined'){setStory(`<div class="narrator">Проходит неделя. Звонок: ИП Смирнов, спор на 400 000 ₽ в арбитраже.</div>`);setTimeout(()=>{state.currentCase={id:0,type:'Арбитражный',name:'Спор с поставщиком рыбы',description:'ИП Смирнов требует взыскать убытки за испорченную рыбу.',difficulty:14,amount:400000,trap:'pretenziya',unwinnable:false,resolved:false};startCourtPrep(state.currentCase,0,0,'direct')},1500);return}
setStory(`<div class="narrator">Вечер. Вы за ноутбуком. Дело против УК «СочиЖилСервис».</div><br><div class="narrator">Как готовиться?</div>`);setChoices([
{tag:'А',text:'Изучить практику по ст. 1102 ГК (потратить энергию, получить бонус).',action:()=>{passDays(5);applyEffects({knowledge:10,energy:-15,money:-500,stress:5});renderStats();setStory(`<div class="success">✔ К полуночи у вас готова чёткая позиция. +10 Знаний.</div>`);setTimeout(startChapter3,1200)}},
{tag:'Б',text:'Пойти в УК и попытаться решить миром.',action:()=>{passDays(3);const roll=d20();if(state.knowledge+roll>=20){applyEffects({money:20000,reputation:10,energy:-10,stress:10});renderStats();setStory(`<div class="success">✔ УК возвращает 20 000 ₽ без суда!</div>`)}else{applyEffects({energy:-15,stress:15});renderStats();setStory(`<div class="failure">✖ В УК вас выпроваживают. Придётся судиться.</div>`)}setTimeout(startChapter3,1500)}},
{tag:'В',text:'Позвонить знакомому судье (−5 000 ₽, +3 к удаче).',action:()=>{passDays(1);state.bribeJudge=true;applyEffects({money:-5000,stress:5});renderStats();setStory(`<div class="narrator">Вы звоните знакомому судье. «Коньяк» передан. +3 к удаче.</div>`);setTimeout(startChapter3,1200)}}
])}

function startChapter3(){state.chapter=3;renderStats();setStory(`<div class="narrator">Зал №4, Центральный районный суд г. Сочи. Дело против УК.</div><br><div class="narrator">Это ваш первый процесс. Как вести себя?</div>`);const luckBonus=state.bribeJudge?3:0;setChoices([
{tag:'А',text:'Требовать почерковедческую экспертизу протокола.',action:()=>{passDays(10);const roll=d20();if(state.knowledge+roll+luckBonus>=15){state.hasExpertise=true;applyEffects({stress:10,energy:-5,money:-25000});renderStats();setStory(`<div class="success">✔ Экспертиза назначена! (−25 000 ₽)</div>`)}else{applyEffects({stress:15});renderStats();setStory(`<div class="failure">✖ Ходатайство отклонено.</div>`)}setTimeout(startChapter4,1500)}},
{tag:'Б',text:'Бить по ст. 1102 ГК — неосновательное обогащение.',action:()=>{passDays(5);const roll=d20();if(state.knowledge+roll+luckBonus>=12){applyEffects({stress:-5,energy:-5});renderStats();setStory(`<div class="success">✔ Позиция убедительна!</div>`)}else{applyEffects({stress:15});renderStats();setStory(`<div class="failure">✖ Судья не впечатлена.</div>`)}setTimeout(startChapter4,1500)}}
])}

function startChapter4(){state.chapter=4;renderStats();setStory(`<div class="narrator">Прошло 3 месяца. Вы уже известны в Сочи.</div><br><div class="narrator">Теперь у вас есть доступ к <span class="highlight">200 искам</span> — гражданским и арбитражным. Каждый проходит через <b>8 процессуальных стадий</b> + апелляция и кассация при поражении.</div><br><div class="law">ГПК РФ · АПК РФ · ГК РФ</div><br><div class="inst">🆕 Обеспечительные меры · Встречный иск · Апелляция · Кассация</div><br><div class="narrator">Пора открыть портфель дел.</div>`);setChoices([{tag:'→',text:'🎲 Открыть портфель из 200 исков',action:()=>{state.casePool=generateCases();startNewCase()}}])}

function init(){const loaded=loadGame();if(loaded){renderStats();showSaveIndicator('📂 Загружено');if(state.gameOver)gameOver(state.stress>=100?'burnout':'bankrupt');else if(state.chapter>=6)showResumeMenu('📂 Прогресс загружен.');else if(state.chapter>=4)startChapter4();else if(state.chapter===3)startChapter3();else if(state.chapter===2)startChapter2();else startChapter1()}else{state.casePool=generateCases();renderStats();startChapter1()}}
init();
</script>
</body>
</html>
